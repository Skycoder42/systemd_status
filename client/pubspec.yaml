name: systemd_status_client
description: Monitor the server status of a systemd based server.
homepage: https://github.com/Skycoder42/systemd_status
version: 0.4.7
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
resolution: workspace

platforms:
  android:
  linux:
  macos:
  windows:
  web:

dependencies:
  ansicolor: ^2.0.3
  dio: ^5.11.1
  file_picker: ^13.1.0
  firebase_auth_rest: ^2.1.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  form_builder_validators: ^11.3.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  http: ^1.6.0
  infinite_scroll_pagination: ^5.1.1
  json_annotation: ^4.12.0
  logging: ^1.3.0
  material_ui: ^1.7.0
  riverpod_annotation: ^4.0.7
  sentry: ^10.1.0
  sentry_dio: ^10.1.0
  sentry_flutter: ^10.1.0
  sentry_logging: ^10.1.0
  systemd_status_server:
    path: ../server
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.16.1
  dart_pre_commit: ^6.1.5
  dart_test_tools: ^7.3.3
  flutter_gen_runner: ^5.15.0
  freezed: ^4.0.1
  go_router_builder: ^4.5.0
  json_serializable: ^6.14.1
  msix: ^3.18.0
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  sentry_dart_plugin: ^3.4.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/

flutter_gen:
  integrations:
    flutter_svg: true

flutter_native_splash:
  color: "#f6f5f4"
  color_dark: "#211F23"
  image: assets/splash/splash-light.png
  image_dark: assets/splash/splash-dark.png

msix_config:
  publisher: CN=E6ED0CED-8505-45BA-AA8A-1C0D6BCB2B76
  publisher_display_name: Skycoder42
  identity_name: Skycoder42.SystemdStatus
  msstore_appId: 9ND8GH0W45WT
  display_name: Systemd Status
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient
  languages: en-us
  execution_alias: systemd_status_client
  output_path: build/windows/msix
  output_name: Systemd Status
  build_windows: false

cask:
  downloadUrl: https://github.com/Skycoder42/systemd_status/releases/download/client%2Fv#{version}/Systemd.Status.dmg

cider:
  link_template:
    tag: https://github.com/Skycoder42/systemd_status/releases/tag/client%2Fv%tag%
    diff: https://github.com/Skycoder42/systemd_status/compare/client%2Fv%from%...v%to%

scripts:
  gen:
    splash: dart run flutter_native_splash:create
  start:
    linux: flutter run -d linux
    web: flutter run -d web-server --web-port 8088 --dart-define=SERVER_URL=https://localhost:8080
