# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json

---
id: de.skycoder42.systemdStatusClient
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
  - org.freedesktop.Sdk.Extension.flutter
  - org.freedesktop.Sdk.Extension.openjdk
command: systemd_status_client
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
writable-sdk: true
modules:
  - name: zenity
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/zenity/4.2/zenity-4.2.2.tar.xz
        sha256: 019186a996096ef4fc356e21577b5673f5baa3a29ac8e3d608b753371c18018d
    cleanup:
      - /share/man
      - /share/help
  - name: systemd_status_client
    buildsystem: simple
    only-arches:
      - x86_64
      - aarch64
    build-options:
      append-path: /usr/lib/sdk/flutter/bin:/usr/lib/sdk/flutter/install/bin:/usr/lib/sdk/flutter/pub-cache/bin:/usr/lib/sdk/llvm22/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      build-args:
        - --share=network
      env:
        FLUTTER_ROOT: /usr/lib/sdk/flutter
        PUB_CACHE: /usr/lib/sdk/flutter/pub-cache
        DART_DATA_HOME: /usr/lib/sdk/flutter
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      secret-env:
        - BUILD_NUMBER
    sources:
      - type: dir
        path: ../../..
        dest: .
      - type: patch
        paths:
          - patch/compiler_warnings.patch
        use-git: false
    build-commands:
      - rm -f /etc/resolv.conf
      - echo 'nameserver 1.1.1.1' > /etc/resolv.conf
      - flutter pub get --enforce-lockfile
      - dart run build_runner build --release --workspace
      - >-
        . /usr/lib/sdk/openjdk/enable.sh &&
        cd client &&
        flutter build linux --release --build-number="$BUILD_NUMBER"
      - cd client && cp -a "$BUNDLE_PATH" /app/
  - name: metadata
    buildsystem: simple
    sources:
      - type: dir
        path: .
        dest: flatpak
    build-commands:
      - mkdir -p /app/bin
      - ln -s /app/systemd_status_client /app/bin/systemd_status_client
      - mkdir -p /app/share/icons/hicolor/scalable/apps
      - >-
        cp -a
        /app/data/flutter_assets/assets/icons/app-icon-light.svg
        /app/share/icons/hicolor/scalable/apps/de.skycoder42.systemdStatusClient.svg
      - mkdir -p /app/share/applications
      - cp -a flatpak/de.skycoder42.systemdStatusClient.desktop /app/share/applications/
      - mkdir -p /app/share/metainfo
      - cp -a flatpak/de.skycoder42.systemdStatusClient.metainfo.xml /app/share/metainfo/
  - name: changelog
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/flutter/bin:/usr/lib/sdk/flutter/.pub-cache/bin:/usr/lib/sdk/llvm22/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      build-args:
        - --share=network
      env:
        FLUTTER_ROOT: /usr/lib/sdk/flutter
        PUB_CACHE: /usr/lib/sdk/flutter/.pub-cache
    sources:
      - type: file
        path: ../../CHANGELOG.md
    build-commands:
      - export-xml-changelog --output /app/share/metainfo/de.skycoder42.systemdStatusClient.metainfo.xml
