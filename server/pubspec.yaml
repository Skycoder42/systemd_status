name: systemd_status_server
description: Monitor the server status of a systemd based server.
homepage: https://github.com/Skycoder42/systemd_status
version: 0.4.2
publish_to: none

environment:
  sdk: ^3.12.0
resolution: workspace

platforms:
  linux:

executables:
  systemd-status-server: server

dependencies:
  args: ^2.7.0
  build_cli_annotations: ^2.1.1
  checked_yaml: ^2.0.4
  content_length_validator: ^1.2.1
  dio: ^5.10.0
  firebase_verify_id_tokens: ^1.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  logging: ^1.3.0
  meta: ^1.18.0
  path: ^1.9.1
  posix: ^6.5.2
  riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  sentry: ^9.25.0
  sentry_logging: ^9.25.0
  shelf: ^1.4.2
  shelf_api: ^1.4.4-dev.2
  shelf_cors_headers: ^0.1.5
  shelf_helmet: ^2.3.0
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3

dev_dependencies:
  build_cli: ^2.2.13
  build_runner: ^2.15.1
  dart_pre_commit: ^6.1.3
  dart_test_tools: ^7.2.8
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.4
  riverpod_lint: ^3.1.4
  shelf_api_builder: ^1.3.4-dev.3

aur:
  maintainer: Skycoder42 <Skycoder42@users.noreply.github.com>
  pkgname: systemd-status-server
  license: BSD
  depends:
    - systemd
  tagPrefix: server/v
  binariesArchivePrefix: systemd-status-server
  sourcesDir: systemd_status-server-v$pkgver/server
  extraSources:
    - name: Systemd.Status.Web-0.4.0.tar.xz
      url: https://github.com/Skycoder42/systemd_status/releases/download/client%2Fv0.4.0/Systemd.Status.Web.tar.xz
  files:
    - source: tool/package-config.yaml
      target: /etc/systemd-status-server.yaml
    - source: ../../web
      target: /usr/share/$pkgname/web-app
      recursive: true
  backup:
    - etc/systemd-status-server.yaml
  makedeb:
    backup:
      - /etc/systemd-status-server.yaml

dart_pre_commit:
  pull-up-dependencies:
    allowed:
      - meta
      - path
      - shelf

cider:
  link_template:
    tag: https://github.com/Skycoder42/systemd_status/releases/tag/server%2Fv%tag%
    diff: https://github.com/Skycoder42/systemd_status/compare/server%2Fv%from%...v%to%
